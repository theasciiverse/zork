# Builds Zork I, II and III for the Asciiverse catalog: each story's av
# archive holds the story file, the start script named after it, and Frotz
# (built here from upstream's 2.55 tag, asciiverse/build-frotz.sh) in lib/.
# One archive per story and target, named <story>-<target>.tar.gz, plus a
# SHA256SUMS file, attached to a GitHub release (hub/catalog/SCHEMA.md,
# release.source = "github").
#
# Tags look like v1-av.1 (the stories do not change; the number counts our
# packaging releases). Linux: static, in Alpine. macOS: both architectures,
# linking only the system's ncurses. No Windows build: Frotz's curses
# interface is for Unix terminals.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  STORIES: zork1 zork2 zork3
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build Frotz
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh asciiverse/build-frotz.sh
          sudo chown -R "$(id -u):$(id -g)" .
          file build/frotz

      - name: Package the stories
        run: |
          mkdir -p dist
          for story in $STORIES; do
            sh asciiverse/stage.sh "$story"
            tar -czf "dist/$story-${{ matrix.target }}.tar.gz" -C "stage/$story" .
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, arch: x86_64 }
          - { target: aarch64-apple-darwin, arch: arm64 }
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build Frotz
        run: |
          CC_ARCH=${{ matrix.arch }} sh asciiverse/build-frotz.sh
          file build/frotz

      - name: Package the stories
        run: |
          mkdir -p dist
          for story in $STORIES; do
            sh asciiverse/stage.sh "$story"
            tar -czf "dist/$story-${{ matrix.target }}.tar.gz" -C "stage/$story" .
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Zork I, II and III $TAG" \
                 --notes "Zork I, II and III, Infocom's games (MIT-licensed by Microsoft in 2025), each packaged with Frotz 2.55 for the Asciiverse catalog."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
